name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --all-targets --locked -- -D warnings

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly"
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked

  compiler-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
      - name: Check out sbpf-compiler-tests
        uses: actions/checkout@v4
        with:
          repository: blueshift-gg/sbpf-compiler-tests
          path: sbpf-compiler-tests
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "nightly"
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            .
            sbpf-compiler-tests
          cache-on-failure: true
      - name: Install cargo-build-sbpf
        run: cargo install --path . --locked --force
      - name: Setup cargo-build-sbpf
        run: cargo build-sbpf setup
      - name: Show tool versions
        run: cargo build-sbpf -V
      - name: Run compiler tests
        working-directory: sbpf-compiler-tests
        run: cargo run --release --locked
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: compiler-tests-artifacts
          path: /tmp/cargo-build-sbpf/
          if-no-files-found: ignore
